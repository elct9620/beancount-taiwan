[project]
name = "beancount-taiwan"
version = "0.1.0"
description = "Beancount data importer tailored for Taiwanese banks, credit cards, and local transaction formats."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beancount>=3.0.0",
    "beangulp>=0.2.0",
    "pyyaml>=6.0.0",
    "typer>=0.15.1",
    "python-dateutil>=2.8.0",
]

[project.scripts]
bean-tw = "beantw.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beantw"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "python-lsp-server>=1.13.1",
    "ruff>=0.14.3",
]
