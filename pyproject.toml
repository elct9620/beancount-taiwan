[project]
name = "beancount-taiwan"
version = "0.1.0"
description = "Beancount data importer tailored for Taiwanese banks, credit cards, and local transaction formats."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beancount>=3.0.0",
    "beangulp>=1.0.0",
    "typer>=0.15.1",
]

[project.scripts]
bean-tw = "beantw.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "python-lsp-server>=1.13.1",
    "ruff>=0.14.3",
]
